name: metadata-validate

on:
  push:
    branches: [main, "feature/**", "fix/**", "deploy-scripts"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r metadata/tools/requirements.txt

      - name: Validate strategy metadata against schema
        run: python metadata/tools/validate.py
