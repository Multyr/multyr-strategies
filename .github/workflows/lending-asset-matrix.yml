name: Lending asset matrix

on:
  push:
    branches: ['codex/lending-multitoken-multichain', 'codex/lending-final-cleanup-20261103']
    paths:
      - 'src/strategies/usdc-lending/**'
      - 'script/**'
      - 'foundry.toml'
      - 'lib/multyr-core'
      - '.gitmodules'
      - 'test/strategies/usdc-lending/**'
      - 'docs/lending-arbitrum-assets-20261103/**'
      - '.github/workflows/lending-asset-matrix.yml'
  pull_request:
    paths:
      - 'src/strategies/usdc-lending/**'
      - 'script/**'
      - 'foundry.toml'
      - 'lib/multyr-core'
      - '.gitmodules'
      - 'test/strategies/usdc-lending/**'
      - 'docs/lending-arbitrum-assets-20261103/**'
      - '.github/workflows/lending-asset-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expanded-arbitrum-four-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ARBITRUM_RPC_URL: https://arbitrum-one.public.blastapi.io
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore frozen real catalogues and canonical block identities
        run: |
          $target='deployments/lending-full-validation-20261101/production/arbitrum-assets'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path 'docs/lending-arbitrum-assets-20261103/catalogues/*.json' -Destination $target
          Copy-Item -LiteralPath 'docs/lending-arbitrum-assets-20261103/inventory.json' -Destination "$target/pinned-inventory.json"
      - name: All 28 cells, real protocol investment, frozen Core exits and weighted portfolios
        run: |
          foreach($stage in @('direct','core','portfolio','warm')) {
            $log="deployments/lending-full-validation-20261101/production/arbitrum-assets/ci-$stage.log"
            python script/lending/validation/arbitrum-assets/run.py --stage $stage *> $log
            $code=$LASTEXITCODE
            Get-Content -LiteralPath $log -Tail 30
            if($code -ne 0){exit $code}
          }
      - name: Preserve every classified cell and failed infrastructure attempt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lending-arbitrum-four-assets
          path: deployments/lending-full-validation-20261101/production/arbitrum-assets/**
  pinned-market-roundtrips:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Foundry 1.4.2 replaces CLI retries/backoff in vm.createSelectFork.
      # URL keys bind that policy even for tests using literal public endpoints.
      FOUNDRY_RPC_ENDPOINTS: >-
        { "https://arbitrum-one.public.blastapi.io" = { endpoint = "https://arbitrum-one.public.blastapi.io", retries = 8, retry_backoff = 2000, compute_units_per_second = 20 },
        "https://eth-mainnet.public.blastapi.io" = { endpoint = "https://eth-mainnet.public.blastapi.io", retries = 8, retry_backoff = 2000, compute_units_per_second = 20 },
        "https://bsc-mainnet.public.blastapi.io" = { endpoint = "https://bsc-mainnet.public.blastapi.io", retries = 8, retry_backoff = 2000, compute_units_per_second = 20 },
        "https://mainnet.base.org" = { endpoint = "https://mainnet.base.org", retries = 8, retry_backoff = 2000, compute_units_per_second = 20 },
        "https://base-mainnet.public.blastapi.io" = { endpoint = "https://base-mainnet.public.blastapi.io", retries = 8, retry_backoff = 2000, compute_units_per_second = 20 },
        "https://polygon.drpc.org" = { endpoint = "https://polygon.drpc.org", retries = 8, retry_backoff = 2000, compute_units_per_second = 20 },
        "https://mainnet.optimism.io" = { endpoint = "https://mainnet.optimism.io", retries = 8, retry_backoff = 2000, compute_units_per_second = 20 } }
      LENDING_RPC_BASE: https://mainnet.base.org
      LENDING_RPC_POLYGON: https://polygon.drpc.org
      LENDING_RPC_OPTIMISM: https://mainnet.optimism.io
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.2
      - name: USDC and WETH on Arbitrum and Base (adapter, strategy, core and swaps)
        run: |
          forge test --match-contract 'Lending((Asset|Strategy|Core)Matrix|RewardRoutes)ForkTest' --threads 1 --fork-url https://arbitrum-one.public.blastapi.io --fork-block-number 520094008 --compute-units-per-second 20 --fork-retries 8 --fork-retry-backoff 2000 -vv --summary *> lending-matrix.log
          $code=$LASTEXITCODE
          Get-Content lending-matrix.log -Tail 40
          if ($code -ne 0) { exit $code }
          ./script/AssertLendingTestSummary.ps1 -LogPath lending-matrix.log -ExpectedPassed 19 -ExpectedSuites 4
      - name: Actual frozen router and explicit legacy migration rejection
        env:
          RUN_ROUTER_HARVEST_FORK: 'true'
          ROUTER_HARVEST_RPC: https://arbitrum-one.public.blastapi.io
          ROUTER_HARVEST_BLOCK: '520094008'
        run: |
          forge test --match-contract 'RouterHarvestForkTest|StrategySettingsCopyTest' --match-test 'test_deployedRouterHarvestAndRecallWithUnchangedCoreCode|test_liveDeprecatedDiversificationRequiresExplicitMigration' --threads 1 --fork-url https://arbitrum-one.public.blastapi.io --fork-block-number 520094008 --compute-units-per-second 20 --fork-retries 8 --fork-retry-backoff 2000 -vv --summary *> lending-legacy.log
          $code=$LASTEXITCODE
          Get-Content lending-legacy.log -Tail 40
          if ($code -ne 0) { exit $code }
          ./script/AssertLendingTestSummary.ps1 -LogPath lending-legacy.log -ExpectedPassed 2 -ExpectedSuites 2
      - name: Generic manifest deployment and complete role handoff
        run: |
          forge test --match-contract LendingDeploymentManifestTest -vv --summary *> lending-manifest.log
          $code=$LASTEXITCODE
          Get-Content lending-manifest.log -Tail 40
          if ($code -ne 0) { exit $code }
          ./script/AssertLendingTestSummary.ps1 -LogPath lending-manifest.log -ExpectedPassed 5 -ExpectedSuites 1
      - name: Unmocked production core, real funding and two withdrawal epochs
        run: |
          forge test --match-contract LendingUnmockedE2ETest --threads 1 --fork-url https://mainnet.base.org --fork-block-number 52500000 --compute-units-per-second 20 --fork-retries 8 --fork-retry-backoff 2000 -vvvv --summary *> lending-unmocked.log
          $code=$LASTEXITCODE
          Get-Content lending-unmocked.log -Tail 40
          if ($code -ne 0) { exit $code }
          ./script/AssertLendingTestSummary.ps1 -LogPath lending-unmocked.log -ExpectedPassed 4 -ExpectedSuites 1
      - name: Published USDC and WETH Comet total supply ABI
        run: |
          forge test --match-contract CometPublishedTotalsForkTest --threads 1 --fork-url https://arbitrum-one.public.blastapi.io --fork-block-number 520094008 --compute-units-per-second 20 --fork-retries 8 --fork-retry-backoff 2000 -vv --summary *> lending-comet.log
          $code=$LASTEXITCODE
          Get-Content lending-comet.log -Tail 40
          if ($code -ne 0) { exit $code }
          ./script/AssertLendingTestSummary.ps1 -LogPath lending-comet.log -ExpectedPassed 2 -ExpectedSuites 1
      - name: All seven real adapter families, additional tokens and production scoring/rebalance
        run: ./script/RunLendingActualMarkets.ps1
      - name: Linux Anvil endpoint ownership and process lifecycle
        run: python script/lending/validation/transaction-gas/test_anvil_lifecycle.py -v
      - name: Seven adapter families on two chains each with actual local-fork transaction receipts
        run: ./script/RunLendingTransactionGas.ps1
      - name: Morpho V2 deployment helper runtime and configuration authority
        run: |
          forge test --match-contract '^MorphoDeploymentWiringTest$' --summary *> lending-v2-wiring.log
          $code=$LASTEXITCODE
          Get-Content lending-v2-wiring.log -Tail 25
          if ($code -ne 0) { exit $code }
          ./script/AssertLendingTestSummary.ps1 -LogPath lending-v2-wiring.log -ExpectedPassed 6 -ExpectedSuites 1
      - name: Lending regression, fuzz and invariants with legacy opt-ins enabled
        env:
          RUN_ROUTER_HARVEST_FORK: 'true'
          ROUTER_HARVEST_RPC: https://arbitrum-one.public.blastapi.io
          ROUTER_HARVEST_BLOCK: '520094008'
        run: |
          forge test --match-path 'test/strategies/usdc-lending/**' --no-match-path 'test/strategies/usdc-lending/fork/**' --summary *> lending-regression.log
          $code=$LASTEXITCODE
          Get-Content lending-regression.log -Tail 40
          if ($code -ne 0) { exit $code }
          ./script/AssertLendingTestSummary.ps1 -LogPath lending-regression.log -ExpectedPassed 2995 -ExpectedSuites 203
      - name: Production size, frozen layout and selector checks
        shell: pwsh
        run: ./script/CheckLendingRelease.ps1
      - name: Preserve source-bound validation evidence and failed attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lending-validation-evidence
          path: |
            lending-*.log
            deployments/lending-full-validation-20261101/**
            docs/lending-full-validation-20261101/actual-acceptance.json
            docs/lending-full-validation-20261101/canonical-headers.json
            docs/lending-verification-20261031/candidate-structure.json
